<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300" width="100%" height="100%" id="nectar-logo-svg">
  <defs>
    <style>
      .logo-green-stroke { stroke: #2E9D66; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .logo-green-fill { fill: #2E9D66; }
      .logo-white-stroke { stroke: #FFFFFF; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .logo-white-fill { fill: #FFFFFF; }
    </style>
    <clipPath id="top-oval-clip">
      <path d="M 100 12 C 40 12, 12 65, 12 145 L 188 145 C 188 65, 160 12, 100 12 Z" />
    </clipPath>
    <clipPath id="bottom-oval-clip">
      <path d="M 12 155 C 12 235, 40 288, 100 288 C 160 288, 188 235, 188 155 Z" />
    </clipPath>
  </defs>

  <!-- TOP HALF: White Background & Green Border -->
  <path id="top-frame" class="logo-green-stroke" d="M 100 12 C 40 12, 12 65, 12 145 L 188 145 C 188 65, 160 12, 100 12 Z" stroke-width="7" fill="#FFFFFF" />

  <!-- BOTTOM HALF: Solid Green Fill & Green Border -->
  <path id="bottom-frame" class="logo-green-stroke logo-green-fill" d="M 12 155 C 12 235, 40 288, 100 288 C 160 288, 188 235, 188 155 Z" stroke-width="7" />

  <!-- CENTER DIVIDER GAP LINE -->
  <line id="divider-line" class="logo-green-stroke" x1="12" y1="150" x2="188" y2="150" stroke-width="7" />

  <!-- ================= TOP PLANT EMBLEM ================= -->
  <g id="top-plant-group">
    <!-- Center Stem -->
    <path id="plant-stem" class="logo-green-stroke" d="M 100 146 L 100 68" stroke-width="6" />

    <!-- Center Top Leaf -->
    <path id="leaf-center-outline" class="logo-green-stroke" d="M 100 42 C 86 58, 93 84, 100 84 C 107 84, 114 58, 100 42 Z" stroke-width="5" fill="#FFFFFF" />
    <path id="leaf-center-vein" class="logo-green-stroke" d="M 100 44 L 100 84" stroke-width="5" />

    <!-- Left Leaf -->
    <path id="leaf-left-outline" class="logo-green-stroke" d="M 56 82 C 60 62, 92 78, 98 86 C 92 96, 65 100, 56 82 Z" stroke-width="5" fill="#FFFFFF" />
    <path id="leaf-left-vein" class="logo-green-stroke" d="M 61 82 L 96 86" stroke-width="5" />

    <!-- Right Leaf -->
    <path id="leaf-right-outline" class="logo-green-stroke" d="M 144 82 C 140 62, 108 78, 102 86 C 108 96, 135 100, 144 82 Z" stroke-width="5" fill="#FFFFFF" />
    <path id="leaf-right-vein" class="logo-green-stroke" d="M 139 82 L 104 86" stroke-width="5" />

    <!-- Top Left 3-Dot Cluster -->
    <g id="dots-top-left" class="logo-green-fill">
      <circle cx="68" cy="64" r="3" />
      <circle cx="62" cy="74" r="3" />
      <circle cx="74" cy="74" r="3" />
    </g>

    <!-- Top Right 3-Dot Cluster -->
    <g id="dots-top-right" class="logo-green-fill">
      <circle cx="132" cy="64" r="3" />
      <circle cx="126" cy="74" r="3" />
      <circle cx="138" cy="74" r="3" />
    </g>
  </g>

  <!-- ================= BOTTOM ROOTS EMBLEM ================= -->
  <g id="bottom-roots-group">
    <!-- Main Center Taproot -->
    <path id="root-taproot" class="logo-white-stroke" d="M 100 154 L 100 248" stroke-width="6" />

    <!-- Root Level 1 (Top Branches) -->
    <path id="root-branch-1l" class="logo-white-stroke" d="M 100 178 L 64 186 M 64 186 L 48 181 M 64 186 L 56 196" stroke-width="4.5" />
    <path id="root-branch-1r" class="logo-white-stroke" d="M 100 178 L 136 186 M 136 186 L 152 181 M 136 186 L 144 196" stroke-width="4.5" />

    <!-- Root Level 2 (Middle Branches) -->
    <path id="root-branch-2l" class="logo-white-stroke" d="M 100 198 L 70 208 M 70 208 L 50 202 M 70 208 L 64 220" stroke-width="4" />
    <path id="root-branch-2r" class="logo-white-stroke" d="M 100 198 L 130 208 M 130 208 L 150 202 M 130 208 L 136 220" stroke-width="4" />

    <!-- Root Level 3 (Lower Branches) -->
    <path id="root-branch-3l" class="logo-white-stroke" d="M 100 218 L 82 228 M 82 228 L 70 238 M 82 228 L 76 244" stroke-width="3.5" />
    <path id="root-branch-3r" class="logo-white-stroke" d="M 100 218 L 118 228 M 118 228 L 130 238 M 118 228 L 124 244" stroke-width="3.5" />

    <!-- Root Tips -->
    <path id="root-tips-l" class="logo-white-stroke" d="M 100 240 L 92 256 M 92 256 L 86 264" stroke-width="3" />
    <path id="root-tips-r" class="logo-white-stroke" d="M 100 240 L 108 256 M 108 256 L 114 264" stroke-width="3" />
    <path id="root-tips-c" class="logo-white-stroke" d="M 100 248 L 100 268" stroke-width="3" />

    <!-- Inner Dashed Contour Line -->
    <path id="root-dashed-contour" class="logo-white-stroke" d="M 38 192 C 38 245, 60 270, 100 270 C 140 270, 162 245, 162 192" stroke-width="4" stroke-dasharray="10,8" opacity="0.95" />

    <!-- Bottom Accent Dots -->
    <circle id="dot-bottom-l" class="logo-white-fill" cx="158" cy="195" r="3.5" />
    <circle id="dot-bottom-r" class="logo-white-fill" cx="42" cy="195" r="3.5" />
  </g>
</svg>
